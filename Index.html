<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Page</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }

        header {
            background: white;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #ddd;
        }

        .logo {
            font-size: 20px;
            font-weight: bold;
        }

        button {
            padding: 10px 15px;
            border: none;
            border-radius: 8px;
            background: #111;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background: #333;
        }

        .page {
            max-width: 700px;
            margin: 25px auto;
            background: white;
            padding: 30px;
            min-height: 500px;
            border-radius: 15px;
        }

        #editor {
            outline: none;
            min-height: 400px;
        }

        @media (max-width: 600px) {
            .page {
                margin: 10px;
                padding: 20px;
            }
        }
    </style>
</head>

<body>

<header>
    <div class="logo">QR Page</div>

    <button onclick="publish()">
        Publish
    </button>
</header>

<div class="page">

    <div
        id="editor"
        contenteditable="true"
    >
        <h1>My Page</h1>

        <p>
            Start writing anything here...
        </p>
    </div>

</div>

<script>

// Load content from localStorage when page loads
window.addEventListener('load', function() {
    const savedContent = localStorage.getItem("myPage");
    if (savedContent) {
        document.getElementById("editor").innerHTML = savedContent;
    }
});

function publish() {

    const content =
        document.getElementById("editor").innerHTML;

    localStorage.setItem(
        "myPage",
        content
    );

    alert("Page published!");

}

</script>

</body>
</html>
